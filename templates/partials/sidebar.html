{% comment %}
Left sidebar. Include as the first child of the page's flex row:
    {% include "partials/sidebar.html" with active="tours" %}
{% endcomment %}

<aside id="appSidebar"
       class="fixed inset-y-0 left-0 z-40 w-64 -translate-x-full bg-ink text-white
              transition-transform lg:static lg:translate-x-0 lg:shrink-0">

    <div class="flex h-full flex-col">

        <a href="/dashboard/"
           class="flex items-center gap-3 border-b border-white/10 px-6 py-5">

            <span class="flex h-9 w-9 items-center justify-center rounded-lg bg-brand
                         font-display text-lg font-bold">
                P
            </span>

            <span class="font-display text-lg font-semibold tracking-tight">
                PayTogether
            </span>

        </a>

        <nav class="flex-1 space-y-1 px-3 py-5 text-sm">

            <a href="/dashboard/"
               class="flex items-center gap-3 rounded-lg px-3 py-2.5 transition
                      {% if active == 'dashboard' %}bg-brand font-semibold text-white{% else %}text-white/70 hover:bg-white/10 hover:text-white{% endif %}">
                Dashboard
            </a>

            <a href="/tours/"
               class="flex items-center gap-3 rounded-lg px-3 py-2.5 transition
                      {% if active == 'tours' %}bg-brand font-semibold text-white{% else %}text-white/70 hover:bg-white/10 hover:text-white{% endif %}">
                My tours
            </a>

            <a href="/tours/create/"
               class="flex items-center gap-3 rounded-lg px-3 py-2.5 transition
                      {% if active == 'create' %}bg-brand font-semibold text-white{% else %}text-white/70 hover:bg-white/10 hover:text-white{% endif %}">
                Start a tour
            </a>

            <a href="/tours/join/"
               class="flex items-center gap-3 rounded-lg px-3 py-2.5 transition
                      {% if active == 'join' %}bg-brand font-semibold text-white{% else %}text-white/70 hover:bg-white/10 hover:text-white{% endif %}">
                Join with a code
            </a>

            <a href="/profile/"
               class="flex items-center gap-3 rounded-lg px-3 py-2.5 transition
                      {% if active == 'profile' %}bg-brand font-semibold text-white{% else %}text-white/70 hover:bg-white/10 hover:text-white{% endif %}">
                My profile
            </a>

        </nav>

        <div class="border-t border-white/10 px-6 py-4 text-xs text-white/50">
            Split trip costs, fairly.
        </div>

    </div>

</aside>

<!-- Dimmer shown behind the sidebar on small screens. -->
<div id="sidebarBackdrop"
     class="fixed inset-0 z-30 hidden bg-ink/50 lg:hidden">
</div>
