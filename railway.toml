[build]
builder = "RAILPACK"
# Railway build containers do not receive service secrets. collectstatic only
# needs Django to initialise, so use a throwaway key here; SECRET_KEY remains
# required for the running web service and migrations.
buildCommand = "SECRET_KEY=railway-build-only-not-a-production-secret python manage.py collectstatic --noinput"

[deploy]
preDeployCommand = ["python manage.py migrate --noinput"]
startCommand = "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
